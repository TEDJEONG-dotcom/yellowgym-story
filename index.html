<!doctype html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<title>옐로우짐 서사 인터뷰</title>
<meta name="description" content="질문에 순서대로 답하면 당신의 이야기가 한 편의 드라마처럼 정리됩니다. 옐로우짐 인터뷰 영상의 시작.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14171C">
<meta property="og:type" content="website">
<meta property="og:title" content="옐로우짐 서사 인터뷰">
<meta property="og:description" content="당신의 이야기가 누군가의 시작이 됩니다. 질문에 답하면 한 편의 드라마처럼 정리해 드려요.">
<meta property="og:image" content="https://yellowgym-story.netlify.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://yellowgym-story.netlify.app/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #14171C; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  .load { position: fixed; inset: 0; display: grid; place-items: center; color: #A2A7AF;
    font: 500 15px/1.5 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  .load b { display: block; width: 28px; height: 28px; margin: 0 auto 14px; background: #FFD21F;
    animation: p 1.2s ease-in-out infinite; }
  @keyframes p { 50% { opacity: .35; transform: scale(.8); } }
</style>
</head>
<body>
<div class="load" id="load"><div><b></b>옐로우짐 서사 인터뷰를 여는 중…</div></div>
<script>
  (function () {
    var APP = 'https://script.google.com/macros/s/AKfycbxnY8aFkWcca8VsNfFl3vADJFII2QUbEvcySKoDKuhzjVPGCFRpDdAE91yBdMiWcLg3-Q/exec';
    // 초대 링크(?i=입장코드&r=역할)만 웹앱으로 넘깁니다.
    var q = new URLSearchParams(location.search), out = new URLSearchParams();
    var i = (q.get('i') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    var r = (q.get('r') || '').toLowerCase();
    if (/^YG\d{2}[A-Z0-9]{5}$/.test(i)) out.set('i', i);
    if (/^(owner|trainer|pilates|yoga|member)$/.test(r)) out.set('r', r);
    var f = document.createElement('iframe');
    f.title = '옐로우짐 서사 인터뷰';
    f.allow = 'clipboard-write; web-share';
    f.referrerPolicy = 'strict-origin';
    f.src = APP + (out.toString() ? '?' + out.toString() : '');
    f.onload = function () { var l = document.getElementById('load'); if (l) l.remove(); };
    document.body.appendChild(f);
    // 웹앱의 '보내기' 버튼 → 휴대폰 공유 창(카카오톡 등)
    window.addEventListener('message', function (e) {
      var d = e.data, h = '';
      try { h = new URL(e.origin).hostname; } catch (x) { return; }
      if (!d || d.type !== 'yg-share' || !/(^|\.)googleusercontent\.com$/.test(h)) return;
      if (navigator.share) navigator.share({ title: String(d.title || ''), text: String(d.text || '') }).catch(function () {});
    });
  })();
</script>
</body>
</html>
